name: CLI smoke test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run 30-second quick-start smoke test
        run: |
          task-capsule --version
          task-capsule init /tmp/task-capsule-demo
          task-capsule verify /tmp/task-capsule-demo
          rm /tmp/task-capsule-demo/DECISION_LOG.md
          if task-capsule verify /tmp/task-capsule-demo; then
            echo "verify unexpectedly passed after required-file removal" >&2
            exit 1
          fi
